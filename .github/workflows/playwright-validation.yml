name: Playwright Browser Validation

on:
  push:
    branches:
      - repair/divyanexus-production
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: divyanexus-playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install application dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright test runner for CI
        run: pnpm add --save-dev --lockfile=false @playwright/test@1.55.0

      - name: TypeScript check
        run: pnpm run check

      - name: Build production application
        env:
          VITE_BASE_PATH: /
        run: pnpm run build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright tests
        run: pnpm exec playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ github.run_id }}
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ github.run_id }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14
