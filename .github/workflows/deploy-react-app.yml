name: Deploy DivyaNexus React App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PRODUCTION_DOMAIN: divyanexus.omsaravanabhava.org

concurrency:
  group: divyanexus-pages-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm run check

      - name: Build production application
        env:
          VITE_BASE_PATH: /
        run: pnpm run build

      - name: Validate Pages artifact
        run: |
          set -euo pipefail
          test -f dist/public/index.html
          test -d dist/public/assets
          test -f CNAME
          test "$(tr -d '\r\n' < CNAME)" = "$PRODUCTION_DOMAIN"
          cp CNAME dist/public/CNAME
          ! grep -R -E "manus-storage|__manus__|BUILT_IN_FORGE|filebin\.net|%VITE_ANALYTICS_" dist/public

      - name: Ensure Pages uses GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
