name: Validate DivyaNexus React App

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: divyanexus-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm run check

      - name: Validate source portability and release markers
        run: pnpm run verify:source-boundaries

      - name: Validate router, manifest and sitemap
        run: pnpm run verify:routes

      - name: Build production application
        env:
          VITE_BASE_PATH: /
        run: pnpm run build

      - name: Validate deployable build artifact
        run: pnpm run verify:build
