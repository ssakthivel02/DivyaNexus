name: Capture DivyaNexus Wave 6 Diagnostics

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Capture compiler output
        shell: bash
        run: |
          set +e
          pnpm install --frozen-lockfile > wave6-diagnostics.txt 2>&1
          echo "install_exit=$?" >> wave6-diagnostics.txt
          pnpm run check >> wave6-diagnostics.txt 2>&1
          echo "typecheck_exit=$?" >> wave6-diagnostics.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: divyanexus-wave6-diagnostics
          path: wave6-diagnostics.txt
          if-no-files-found: error
          retention-days: 2
