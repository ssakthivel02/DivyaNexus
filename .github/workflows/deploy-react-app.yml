name: Deploy DivyaNexus React App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  PRODUCTION_DOMAIN: divyanexus.omsaravanabhava.org
  RELEASE_ID: stage-b-wave4

concurrency:
  group: divyanexus-pages-production
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: TypeScript check
        run: pnpm run check

      - name: Validate source, route and editorial contracts
        run: |
          node scripts/validate-source-boundaries.mjs
          pnpm exec tsx scripts/validate-route-manifest.ts
          pnpm exec tsx scripts/validate-editorial-registry.ts

      - name: Build production application
        env:
          VITE_BASE_PATH: /
        run: pnpm run build

      - name: Materialize GitHub Pages direct routes
        run: pnpm exec tsx scripts/materialize-pages-routes.ts

      - name: Validate deployable build artifact
        run: node scripts/validate-build-artifact.mjs

      - name: Attach custom-domain and release evidence
        shell: bash
        run: |
          set -euo pipefail
          test -f CNAME
          test "$(tr -d '\r\n' < CNAME)" = "$PRODUCTION_DOMAIN"
          cp CNAME dist/public/CNAME

          built_at="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          cat > dist/public/release.json <<EOF
          {
            "release": "$RELEASE_ID",
            "commit": "$GITHUB_SHA",
            "runId": "$GITHUB_RUN_ID",
            "repository": "$GITHUB_REPOSITORY",
            "builtAt": "$built_at"
          }
          EOF

          grep -Fq '"release": "stage-b-wave4"' dist/public/release.json
          grep -Fq '"commit": "'"$GITHUB_SHA"'"' dist/public/release.json
          test -f dist/public/CNAME

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist/public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
