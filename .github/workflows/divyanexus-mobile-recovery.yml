name: DivyaNexus Mobile Recovery

on:
  push:
    branches: [main]
    paths:
      - "mobile-recovery/**"
      - ".github/workflows/divyanexus-mobile-recovery.yml"
  pull_request:
    paths:
      - "mobile-recovery/**"
      - ".github/workflows/divyanexus-mobile-recovery.yml"
  workflow_dispatch:
    inputs:
      run_eas_preview:
        description: "Queue signed EAS preview APK using existing credentials"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: divyanexus-mobile-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "1"

jobs:
  validate-and-compile:
    name: Validate and compile Android
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Reconstruct audited source
        run: bash mobile-recovery/reconstruct.sh _mobile

      - name: Install clean dependency graph
        working-directory: _mobile
        run: npm install --no-audit --no-fund

      - name: Validate and compile Android
        run: bash mobile-recovery/validate-android.sh _mobile

      - name: Upload compile-validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: divyanexus-v1.0.3-code4-compile-validation
          if-no-files-found: error
          retention-days: 14
          path: |
            _mobile/android/app/build/outputs/apk/debug/app-debug.apk
            _mobile/android/app/build/outputs/bundle/release/app-release.aab
            _mobile/android/app/build/reports/lint-results-release.html
            _mobile/reports/
            _mobile/package-lock.json

  eas-preview:
    name: Queue signed EAS preview APK
    if: github.event_name == 'workflow_dispatch' && inputs.run_eas_preview == true
    needs: validate-and-compile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.4"

      - name: Require existing Expo authentication
        run: test -n "${EXPO_TOKEN:-}" || { echo 'EXPO_TOKEN is missing; refusing to create or replace credentials.' >&2; exit 1; }

      - name: Reconstruct audited source
        run: bash mobile-recovery/reconstruct.sh _mobile

      - name: Install clean dependency graph
        working-directory: _mobile
        run: npm install --no-audit --no-fund

      - name: Queue signed preview without changing credentials
        working-directory: _mobile
        run: |
          npx eas-cli@latest build \
            --platform android \
            --profile preview \
            --clear-cache \
            --non-interactive \
            --freeze-credentials \
            --json | tee eas-preview-build.json

      - uses: actions/upload-artifact@v4
        with:
          name: divyanexus-eas-preview-build-record
          if-no-files-found: error
          path: _mobile/eas-preview-build.json
