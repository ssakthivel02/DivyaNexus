name: DivyaNexus Nightly Quality

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: divyanexus-nightly-quality
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install application dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright test runner
        run: pnpm add --save-dev --lockfile=false @playwright/test@1.55.0

      - name: TypeScript check
        run: pnpm run check

      - name: Run source, route and editorial contracts
        run: |
          node scripts/validate-source-boundaries.mjs
          pnpm exec tsx scripts/validate-route-manifest.ts
          pnpm exec tsx scripts/validate-editorial-registry.ts

      - name: Build production application
        env:
          VITE_BASE_PATH: /
        run: pnpm run build

      - name: Materialize GitHub Pages direct routes
        run: pnpm exec tsx scripts/materialize-pages-routes.ts

      - name: Validate deployable build artifact
        run: node scripts/validate-build-artifact.mjs

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser contracts
        run: >-
          pnpm exec playwright test
          tests/e2e/release-contract.spec.ts
          tests/e2e/status-page.spec.ts
          tests/e2e/route-manifest.spec.ts
          tests/e2e/security-boundary.spec.ts
          tests/e2e/collection-status.spec.ts
          tests/e2e/editorial-search.spec.ts
          tests/e2e/editorial-directories.spec.ts

      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-quality-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
