name: Capture DivyaNexus Main Actions Status

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      WEBSITE_URL: https://divyanexus.omsaravanabhava.org
    steps:
      - uses: actions/checkout@v4

      - name: Capture recent main workflow runs and production endpoints
        shell: bash
        run: |
          set +e
          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=50" > main-actions-runs.json 2> main-actions-runs.err
          echo "actions_exit=$?" > diagnostic-status.txt

          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-react-app.yml/runs?branch=main&per_page=20" > deploy-runs.json 2> deploy-runs.err
          echo "deploy_exit=$?" >> diagnostic-status.txt

          gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/production-smoke.yml/runs?branch=main&per_page=20" > smoke-runs.json 2> smoke-runs.err
          echo "smoke_exit=$?" >> diagnostic-status.txt

          latest_smoke_id=$(node -e "const d=require('./smoke-runs.json'); console.log(d.workflow_runs?.[0]?.id || '')")
          echo "latest_smoke_id=$latest_smoke_id" >> diagnostic-status.txt
          if [[ -n "$latest_smoke_id" ]]; then
            gh run view "$latest_smoke_id" --repo "$GITHUB_REPOSITORY" --log-failed > smoke-failed.log 2> smoke-failed.err
            echo "smoke_log_exit=$?" >> diagnostic-status.txt
          fi

          gh api -X GET "repos/$GITHUB_REPOSITORY/pages" > pages-site.json 2> pages-site.err
          echo "pages_exit=$?" >> diagnostic-status.txt

          gh api -X GET "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=20" > pages-deployments.json 2> pages-deployments.err
          echo "deployments_exit=$?" >> diagnostic-status.txt

          cache_key="${GITHUB_RUN_ID}-$(date +%s)"
          for endpoint in sitemap.xml robots.txt .well-known/security.txt release.json health.json collection-status; do
            safe_name=$(echo "$endpoint" | tr '/.' '__')
            curl --connect-timeout 10 --max-time 30 -L -sS \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -D "production-${safe_name}.headers" \
              -o "production-${safe_name}.body" \
              -w '%{http_code}\n' \
              "$WEBSITE_URL/$endpoint?diagnostic=$cache_key" > "production-${safe_name}.status" 2> "production-${safe_name}.err"
          done

          cat diagnostic-status.txt

      - name: Upload deployment diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: divyanexus-main-actions-status
          path: |
            diagnostic-status.txt
            main-actions-runs.json
            main-actions-runs.err
            deploy-runs.json
            deploy-runs.err
            smoke-runs.json
            smoke-runs.err
            smoke-failed.log
            smoke-failed.err
            pages-site.json
            pages-site.err
            pages-deployments.json
            pages-deployments.err
            production-*
          if-no-files-found: error
          retention-days: 2
