name: Verify DivyaNexus Production

on:
  workflow_run:
    workflows:
      - Deploy DivyaNexus React App
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: divyanexus-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WEBSITE_URL: https://divyanexus.omsaravanabhava.org
      EXPECTED_RELEASE: stage-b-wave4
      EXPECTED_TITLE: DivyaNexus — Vedic Knowledge & Learning
      EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Verify release, commit, health and linked assets
        shell: bash
        run: |
          set -euo pipefail

          verify_release_html() {
            local file="$1"
            grep -Fq '<div id="root" data-divyanexus-version="'"$EXPECTED_RELEASE"'">' "$file"
            grep -Fq '<meta name="divyanexus-release" content="'"$EXPECTED_RELEASE"'"' "$file"
            grep -Fq "<title>$EXPECTED_TITLE</title>" "$file"
            ! grep -Fq 'Ancient Wisdom. Modern Intelligence.' "$file"
            ! grep -Eq 'manus-storage|__manus__|BUILT_IN_FORGE|filebin\.net|%VITE_ANALYTICS_' "$file"
          }

          verify_release_json() {
            local file="$1"
            grep -Fq '"release": "'"$EXPECTED_RELEASE"'"' "$file"
            if [[ -n "${EXPECTED_COMMIT:-}" ]]; then
              grep -Fq '"commit": "'"$EXPECTED_COMMIT"'"' "$file"
            fi
          }

          verify_health_json() {
            local file="$1"
            grep -Fq '"status": "ok"' "$file"
            grep -Fq '"release": "'"$EXPECTED_RELEASE"'"' "$file"
          }

          success=0
          for attempt in {1..48}; do
            cache_key="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"

            site_code=$(curl --connect-timeout 10 --max-time 30 -L -sS \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -H 'Pragma: no-cache' \
              -o /tmp/site.html \
              -w '%{http_code}' \
              "$WEBSITE_URL/?deployment-check=$cache_key") || site_code=000

            release_code=$(curl --connect-timeout 10 --max-time 30 -L -sS \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -o /tmp/release.json \
              -w '%{http_code}' \
              "$WEBSITE_URL/release.json?deployment-check=$cache_key") || release_code=000

            health_code=$(curl --connect-timeout 10 --max-time 30 -L -sS \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -o /tmp/health.json \
              -w '%{http_code}' \
              "$WEBSITE_URL/health.json?deployment-check=$cache_key") || health_code=000

            if [[ "$site_code" == "200" && "$release_code" == "200" && "$health_code" == "200" ]] \
              && verify_release_html /tmp/site.html \
              && verify_release_json /tmp/release.json \
              && verify_health_json /tmp/health.json; then

              mapfile -t assets < <(
                grep -Eo '(src|href)="[^"]+\.(js|mjs|css)(\?[^\"]*)?"' /tmp/site.html \
                  | sed -E 's/^(src|href)="//; s/"$//' \
                  | sort -u
              )

              if [[ ${#assets[@]} -gt 0 ]]; then
                all_assets_ok=1
                for asset in "${assets[@]}"; do
                  if [[ "$asset" =~ ^https?:// ]]; then
                    asset_url="$asset"
                  elif [[ "$asset" == /* ]]; then
                    asset_url="$WEBSITE_URL$asset"
                  else
                    asset_url="$WEBSITE_URL/$asset"
                  fi

                  asset_code=$(curl --connect-timeout 10 --max-time 30 -L -sS \
                    -H 'Cache-Control: no-cache' \
                    -o /dev/null \
                    -w '%{http_code}' \
                    "$asset_url") || asset_code=000

                  echo "$asset_code $asset_url"
                  if [[ "$asset_code" != "200" ]]; then
                    all_assets_ok=0
                  fi
                done

                if [[ "$all_assets_ok" == "1" ]]; then
                  success=1
                  break
                fi
              fi
            fi

            echo "Attempt $attempt: site=$site_code release=$release_code health=$health_code; waiting 10 seconds."
            sleep 10
          done

          if [[ "$success" != "1" ]]; then
            echo "Production verification failed for release $EXPECTED_RELEASE and commit ${EXPECTED_COMMIT:-manual-check}."
            echo "Homepage evidence:"
            sed -n '1,40p' /tmp/site.html || true
            echo "Release evidence:"
            cat /tmp/release.json || true
            echo "Health evidence:"
            cat /tmp/health.json || true
            exit 1
          fi

          echo "Release $EXPECTED_RELEASE, commit evidence, health contract and linked assets verified."

      - name: Verify direct application routes
        shell: bash
        run: |
          set -euo pipefail

          routes=(
            scriptures
            deities
            deities/murugan
            ask-divya
            life-guidance
            glossary
            learning
            kids
            collection-status
            library
            sources
            privacy
            status
          )

          for route in "${routes[@]}"; do
            safe_name="$(echo "$route" | tr '/' '_')"
            route_code=$(curl --connect-timeout 10 --max-time 30 -L -sS \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -o "/tmp/$safe_name.html" \
              -w '%{http_code}' \
              "$WEBSITE_URL/$route?route-check=${GITHUB_RUN_ID}") || route_code=000

            echo "$route_code /$route"
            test "$route_code" = "200"
            grep -Fq 'data-divyanexus-version="'"$EXPECTED_RELEASE"'"' "/tmp/$safe_name.html"
            ! grep -Fq 'Ancient Wisdom. Modern Intelligence.' "/tmp/$safe_name.html"
          done

          echo "Direct routes verified against the current React application shell."

      - name: Verify public operational and offline endpoints
        shell: bash
        run: |
          set -euo pipefail

          for endpoint in robots.txt sitemap.xml manifest.webmanifest sw.js offline.html .well-known/security.txt; do
            code=$(curl --connect-timeout 10 --max-time 30 -L -sS \
              -o "/tmp/$(echo "$endpoint" | tr '/.' '__')" \
              -w '%{http_code}' \
              "$WEBSITE_URL/$endpoint?endpoint-check=${GITHUB_RUN_ID}") || code=000
            echo "$code /$endpoint"
            test "$code" = "200"
          done

          grep -Fq 'Sitemap: https://divyanexus.omsaravanabhava.org/sitemap.xml' /tmp/robots_txt
          grep -Fq 'https://divyanexus.omsaravanabhava.org/status' /tmp/sitemap_xml
          grep -Fq 'https://divyanexus.omsaravanabhava.org/collection-status' /tmp/sitemap_xml
          grep -Fq '"shortcuts"' /tmp/manifest_webmanifest
          grep -Fq 'divyanexus-stage-b-wave7-v1' /tmp/sw_js
          grep -Fq 'owner-selected-vision.webp' /tmp/sw_js
          grep -Fq 'This path is not cached yet.' /tmp/offline_html
          grep -Fq 'Canonical: https://divyanexus.omsaravanabhava.org/.well-known/security.txt' /tmp/_well-known_security_txt
          echo "Robots, sitemap, manifest, service worker, offline fallback and coordinated disclosure endpoints verified."

      - name: Verify owner-selected artwork asset
        shell: bash
        run: |
          set -euo pipefail

          artwork_url="$WEBSITE_URL/assets/divyanexus/owner-selected-vision.webp?artwork-check=${GITHUB_RUN_ID}"
          artwork_code=$(curl --connect-timeout 10 --max-time 30 -L -sS \
            -D /tmp/owner-artwork.headers \
            -o /tmp/owner-selected-vision.webp \
            -w '%{http_code}' \
            "$artwork_url") || artwork_code=000

          echo "$artwork_code /assets/divyanexus/owner-selected-vision.webp"
          test "$artwork_code" = "200"
          grep -Eiq '^content-type:[[:space:]]*image/webp' /tmp/owner-artwork.headers

          artwork_bytes=$(wc -c < /tmp/owner-selected-vision.webp)
          test "$artwork_bytes" -ge 100000
          test "$artwork_bytes" -le 900000
          test "$(head -c 4 /tmp/owner-selected-vision.webp)" = "RIFF"
          test "$(dd if=/tmp/owner-selected-vision.webp bs=1 skip=8 count=4 status=none)" = "WEBP"

          echo "Owner-selected WebP verified in production: ${artwork_bytes} bytes."
