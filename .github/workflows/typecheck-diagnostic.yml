name: Capture DivyaNexus TypeScript Diagnostics

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Capture TypeScript output
        shell: bash
        run: |
          set +e
          pnpm run check > typecheck-diagnostics.txt 2>&1
          status=$?
          echo "exit_code=$status" >> typecheck-diagnostics.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: divyanexus-typecheck-diagnostics
          path: typecheck-diagnostics.txt
          if-no-files-found: error
