name: Capture DivyaNexus Wave 4 Diagnostics

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Capture validator output
        shell: bash
        run: |
          set +e
          {
            echo '=== install ==='
            pnpm install --frozen-lockfile
            echo "install_exit=$?"
            echo '=== typecheck ==='
            pnpm run check
            echo "typecheck_exit=$?"
            echo '=== source boundaries ==='
            node scripts/validate-source-boundaries.mjs
            echo "source_exit=$?"
            echo '=== route manifest ==='
            pnpm exec tsx scripts/validate-route-manifest.ts
            echo "route_exit=$?"
            echo '=== build ==='
            VITE_BASE_PATH=/ pnpm run build
            echo "build_exit=$?"
            echo '=== build artifact ==='
            node scripts/validate-build-artifact.mjs
            echo "artifact_exit=$?"
            echo '=== dist files ==='
            find dist/public -maxdepth 4 -type f -printf '%p %s bytes\n' | sort
          } > wave4-diagnostics.txt 2>&1
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: divyanexus-wave4-diagnostics
          path: wave4-diagnostics.txt
          if-no-files-found: error
          retention-days: 2
