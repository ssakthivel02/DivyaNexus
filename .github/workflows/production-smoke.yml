name: Verify DivyaNexus Production

on:
  workflow_run:
    workflows:
      - Deploy DivyaNexus React App
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: divyanexus-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WEBSITE_URL: https://divyanexus.omsaravanabhava.org
      EXPECTED_RELEASE: stage-b-wave8
      EXPECTED_TITLE: DivyaNexus — Vedic Knowledge & Learning
      EXPECTED_COMMIT: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Wait for the exact deployment release
        shell: bash
        run: |
          set -euo pipefail
          success=0
          for attempt in {1..48}; do
            key="${GITHUB_RUN_ID}-${attempt}-$(date +%s)"
            site_code=$(curl --connect-timeout 10 --max-time 30 -L -sS -H 'Cache-Control: no-cache, no-store' -o /tmp/site.html -w '%{http_code}' "$WEBSITE_URL/?deployment-check=$key") || site_code=000
            release_code=$(curl --connect-timeout 10 --max-time 30 -L -sS -H 'Cache-Control: no-cache, no-store' -o /tmp/release.json -w '%{http_code}' "$WEBSITE_URL/release.json?deployment-check=$key") || release_code=000
            health_code=$(curl --connect-timeout 10 --max-time 30 -L -sS -H 'Cache-Control: no-cache, no-store' -o /tmp/health.json -w '%{http_code}' "$WEBSITE_URL/health.json?deployment-check=$key") || health_code=000
            if [[ "$site_code" == 200 && "$release_code" == 200 && "$health_code" == 200 ]] \
              && grep -Fq '<div id="root" data-divyanexus-version="'"$EXPECTED_RELEASE"'">' /tmp/site.html \
              && grep -Fq "<title>$EXPECTED_TITLE</title>" /tmp/site.html \
              && grep -Fq '"release": "'"$EXPECTED_RELEASE"'"' /tmp/release.json \
              && grep -Fq '"release": "'"$EXPECTED_RELEASE"'"' /tmp/health.json \
              && grep -Fq '"status": "ok"' /tmp/health.json; then
              if [[ -z "${EXPECTED_COMMIT:-}" ]] || grep -Fq '"commit": "'"$EXPECTED_COMMIT"'"' /tmp/release.json; then
                success=1
                break
              fi
            fi
            echo "Attempt $attempt: site=$site_code release=$release_code health=$health_code"
            sleep 10
          done
          test "$success" = 1
          ! grep -Fq 'Ancient Wisdom. Modern Intelligence.' /tmp/site.html
          ! grep -Eq 'manus-storage|__manus__|BUILT_IN_FORGE|filebin\.net' /tmp/site.html

      - name: Verify direct React routes
        shell: bash
        run: |
          set -euo pipefail
          routes=(
            scriptures rig-veda bhagavad-gita audio deities deities/murugan
            ask-divya life-guidance glossary learning kids collection-status
            library sources privacy status
          )
          for route in "${routes[@]}"; do
            file="/tmp/$(echo "$route" | tr '/' '_').html"
            code=$(curl --connect-timeout 10 --max-time 30 -L -sS -H 'Cache-Control: no-cache, no-store' -o "$file" -w '%{http_code}' "$WEBSITE_URL/$route?route-check=${GITHUB_RUN_ID}") || code=000
            echo "$code /$route"
            test "$code" = 200
            grep -Fq 'data-divyanexus-version="'"$EXPECTED_RELEASE"'"' "$file"
          done

      - name: Verify Wave 8 offline and public endpoints
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in robots.txt sitemap.xml manifest.webmanifest sw.js offline.html .well-known/security.txt; do
            file="/tmp/$(echo "$endpoint" | tr '/.' '__')"
            code=$(curl --connect-timeout 10 --max-time 30 -L -sS -o "$file" -w '%{http_code}' "$WEBSITE_URL/$endpoint?endpoint-check=${GITHUB_RUN_ID}") || code=000
            echo "$code /$endpoint"
            test "$code" = 200
          done
          grep -Fq 'divyanexus-stage-b-wave8-v1' /tmp/sw_js
          grep -Fq 'owner-selected-vision.webp' /tmp/sw_js
          grep -Fq 'This path is not cached yet.' /tmp/offline_html
          grep -Fq '"shortcuts"' /tmp/manifest_webmanifest
          grep -Fq 'https://divyanexus.omsaravanabhava.org/status' /tmp/sitemap_xml

      - name: Verify owner-selected artwork bytes
        shell: bash
        run: |
          set -euo pipefail
          code=$(curl --connect-timeout 10 --max-time 30 -L -sS -D /tmp/art.headers -o /tmp/owner.webp -w '%{http_code}' "$WEBSITE_URL/assets/divyanexus/owner-selected-vision.webp?artwork-check=${GITHUB_RUN_ID}") || code=000
          test "$code" = 200
          grep -Eiq '^content-type:[[:space:]]*image/webp' /tmp/art.headers
          bytes=$(wc -c < /tmp/owner.webp)
          test "$bytes" -ge 100000
          test "$bytes" -le 900000
          test "$(head -c 4 /tmp/owner.webp)" = RIFF
          test "$(dd if=/tmp/owner.webp bs=1 skip=8 count=4 status=none)" = WEBP
          echo "Owner-selected WebP verified: ${bytes} bytes."
