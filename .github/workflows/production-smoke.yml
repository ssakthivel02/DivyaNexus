name: Verify DivyaNexus Production

on:
  workflow_run:
    workflows:
      - Deploy DivyaNexus React App
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: divyanexus-production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WEBSITE_URL: https://divyanexus.omsaravanabhava.org
    steps:
      - name: Verify homepage and deployed assets
        shell: bash
        run: |
          set -euo pipefail

          success=0
          for attempt in {1..30}; do
            site_code=$(curl --connect-timeout 10 --max-time 30 -L -sS \
              -H 'Cache-Control: no-cache' \
              -o /tmp/site.html \
              -w '%{http_code}' \
              "$WEBSITE_URL/?deployment-check=${GITHUB_RUN_ID}-${attempt}") || site_code=000

            if [[ "$site_code" == "200" ]]; then
              mapfile -t assets < <(
                grep -Eo '(src|href)="[^"]+\.(js|mjs|css)(\?[^\"]*)?"' /tmp/site.html \
                  | sed -E 's/^(src|href)="//; s/"$//' \
                  | sort -u
              )

              if [[ ${#assets[@]} -gt 0 ]]; then
                all_assets_ok=1
                for asset in "${assets[@]}"; do
                  if [[ "$asset" =~ ^https?:// ]]; then
                    asset_url="$asset"
                  elif [[ "$asset" == /* ]]; then
                    asset_url="$WEBSITE_URL$asset"
                  else
                    asset_url="$WEBSITE_URL/$asset"
                  fi

                  asset_code=$(curl --connect-timeout 10 --max-time 30 -L -sS \
                    -H 'Cache-Control: no-cache' \
                    -o /dev/null \
                    -w '%{http_code}' \
                    "$asset_url") || asset_code=000

                  echo "$asset_code $asset_url"
                  if [[ "$asset_code" != "200" ]]; then
                    all_assets_ok=0
                  fi
                done

                if [[ "$all_assets_ok" == "1" ]]; then
                  success=1
                  break
                fi
              fi
            fi

            echo "Attempt $attempt: homepage HTTP $site_code; waiting 10 seconds."
            sleep 10
          done

          if [[ "$success" != "1" ]]; then
            echo "Production verification failed: homepage or linked JS/CSS assets are unavailable."
            exit 1
          fi

          grep -qi '<title' /tmp/site.html
          echo "DivyaNexus production homepage and linked assets verified."
