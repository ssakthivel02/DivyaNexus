name: Capture DivyaNexus Wave 5 Diagnostics

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Capture Wave 5 output
        shell: bash
        run: |
          set +e
          {
            echo '=== frozen install ==='
            pnpm install --frozen-lockfile
            echo "install_exit=$?"
            echo '=== typecheck ==='
            pnpm run check
            echo "typecheck_exit=$?"
            echo '=== editorial registry ==='
            pnpm exec tsx scripts/validate-editorial-registry.ts
            echo "editorial_exit=$?"
          } > wave5-diagnostics.txt 2>&1
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: divyanexus-wave5-diagnostics
          path: wave5-diagnostics.txt
          if-no-files-found: error
          retention-days: 2
