name: Apply DivyaNexus Wave 8 Source Patches

on:
  push:
    branches:
      - fix/divyanexus-readability-audio-wave8
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: divyanexus-wave8-source-patcher
  cancel-in-progress: false

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message || '', 'apply Wave 8 source patches') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Wave 8 branch
        uses: actions/checkout@v4
        with:
          ref: fix/divyanexus-readability-audio-wave8
          fetch-depth: 0

      - name: Apply deterministic source patches
        run: node scripts/apply-wave8-source-patches.mjs

      - name: Commit patched sources
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "feat: apply Wave 8 source patches"
          git push origin HEAD:fix/divyanexus-readability-audio-wave8
